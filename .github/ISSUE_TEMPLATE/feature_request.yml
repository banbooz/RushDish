name: Feature request
description: Suggest a focused improvement to the RushDish prototype.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operator need would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behaviour without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups or examples if they make the request clearer.
