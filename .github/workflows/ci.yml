name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build GitHub Pages export
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /RushDish
          NEXT_PUBLIC_BASE_PATH: /RushDish
          NEXT_PUBLIC_SITE_URL: https://banbooz.github.io/RushDish/
      - run: npm run test:pages
